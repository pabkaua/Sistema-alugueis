name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build do .jar
        run: mvn -B clean package -DskipTests

      # Versionamento automatico
      - name: Gerar proxima versao
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Renomear jar com a versao
        run: cp target/*.jar app-${{ steps.tag.outputs.new_tag }}.jar

      # imagem docker

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            hcr.io/${{ github.repository }}:${{ steps.tag.outputs.new_tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # release com o jar anexado
      - name: Criar github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: |
            Imagem Docker: `ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.new_tag }}`
          files: app-${{ steps.tag.outputs.new_tag }}.jar
          generate_release_notes: true
          
